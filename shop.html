<!doctype html>
<html lang="en" class="cover">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Shop | Wheels of Vic</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <div id="site-header"></div>
    <main>
      <div class="wrap page-title"><h1>Shop</h1></div>
      <section>
        <div class="wrap">
          <p class="lede">
            Limited drops are coming. Join the list to hear first.
          </p>
          <div class="grid">
            <div class="card">
              <div class="plate" style="background: #1d4a5c">Cap</div>
              <div class="meta">
                <b>Wheels of Vic cap</b><span>Coming soon</span>
              </div>
            </div>
            <div class="card">
              <div class="plate" style="background: #8a2a1a">Tee</div>
              <div class="meta"><b>Logo tee</b><span>Coming soon</span></div>
            </div>
            <div class="card">
              <div class="plate" style="background: #3b5b45">Sticker</div>
              <div class="meta">
                <b>Sticker pack</b><span>Coming soon</span>
              </div>
            </div>
          </div>
        </div>
      </section>
      <section class="dark">
        <div class="wrap">
          <h2>Join the list</h2>
          <p class="lede">
            Meet dates, driver stories and film drops. Nothing else.
          </p>
          <form class="join" data-demo="Thanks. You are on the list.">
            <input
              type="email"
              required
              placeholder="you@email.com"
              aria-label="Email address"
            /><button class="btn hot" type="submit">Join the list</button>
          </form>
          <div class="msg" role="status"></div>
        </div>
      </section>
    </main>
    <div id="site-footer"></div>
    <script src="js/stories.js"></script>
    <script src="js/layout.js"></script>
  </body>
</html>
